<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tela de login da plataforma Prepila Dyson para monitoramento e gestão inteligente de energia solar espacial.">
  <title>Login | Prepila Dyson</title>
  <link rel="stylesheet" href="/assets/css/login.css">
</head>
<body>
  <header class="topbar">
    <a class="home-link" href="index.html" aria-label="Voltar para a página inicial">
      <span aria-hidden="true">⌂</span>
    </a>

    <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-principal">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand-area">
        <img class="brand-logo" src="../../assets/images/icon/Icon.png" alt="Logo Prepila Dyson">
        <h1 id="login-title">Faça seu login</h1>
        <p class="subtitle">Acesse o painel de controle da energia solar espacial.</p>
      </div>

      <form class="login-form" id="loginForm" novalidate>
        <div class="form-group">
          <label for="userLogin">Usuário</label>
          <input type="text" id="userLogin" name="userLogin" autocomplete="username" placeholder="ex: admPrepilaDyson" required>
          <small class="error-message" id="userLoginError"></small>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>

          <div class="password-wrapper">
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Digite sua senha" required minlength="6">
            <button class="show-password" type="button" aria-label="Mostrar senha">○</button>
          </div>

          <div class="form-row">
            <label class="remember-option">
              <input type="checkbox" name="remember">
              <span>Lembrar acesso</span>
            </label>


            <button class="forgot-link" type="button" aria-haspopup="dialog" aria-controls="forgotPasswordModal" data-open-forgot-password>Esqueceu a senha?</button>
          </div>

          <small class="error-message" id="passwordError"></small>
        </div>

        <button class="primary-button" type="submit">Conecte-se</button>
        <p class="form-feedback" id="formFeedback" role="status"></p>
      </form>
      </section>
  </main>

  <footer class="footer">
    <p>© 2026 Prepila Dyson — FIAP Global Solution</p>
  </footer>

  <div class="support-modal" id="forgotPasswordModal" role="dialog" aria-modal="true" aria-labelledby="forgotPasswordTitle" hidden>
    <div class="support-dialog">
      <button class="modal-close" type="button" aria-label="Fechar aviso" data-close-forgot-password>×</button>

      <div class="support-heading">
        <span aria-hidden="true">🔐</span>
        <div>
          <h2 id="forgotPasswordTitle">Recuperação de senha</h2>
          <p>Entre em contato com um administrador ou com a equipe da Prepila Dyson pelo email:</p>
        </div>
      </div>

      <a class="support-email" href="mailto:admPrepilaDyson@fiap.com.br">admPrepilaDyson@prepiladyson.com.br</a>
      <button class="primary-button modal-action" type="button" data-close-forgot-password>Entendi</button>
    </div>
  </div>

  <script src="/assets/js/login.js"></script>
  <script>
    window.watsonAssistantChatOptions = {
      integrationID: "7721fd3b-7e06-4afc-a3b7-8d4f690c9ef1", // The ID of this integration.
      region: "https://integrations.au-syd.assistant.watson.appdomain.cloud", // The region your integration is hosted in.
      serviceInstanceID: "388da1e1-e3f5-44cd-b178-bf833e35f19b", // The ID of your service instance.
      onLoad: async (instance) => { await instance.render(); }
    };
    setTimeout(function(){
      const t=document.createElement('script');
      t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" + (window.watsonAssistantChatOptions.clientVersion || 'latest') + "/WatsonAssistantChatEntry.js";
      document.head.appendChild(t);
    });
  </script>
</body>
</html>
